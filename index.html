<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BITS Pilani Dubai Campus - Mess Feedback Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .star-rating i { cursor: pointer; transition: color 0.15s ease-in-out; }
    .star-rating i.active { color: #f59e0b; }
    .star-rating i.inactive { color: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Header Banner -->
  <header class="bg-slate-900 text-white shadow-lg border-b-4 border-amber-500">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center space-x-3">
      <div class="bg-amber-500 text-slate-900 p-2.5 rounded-xl font-black text-xl tracking-wider shadow">BITS</div>
      <div>
        <h1 class="font-bold text-lg leading-tight">BITS Pilani, Dubai Campus</h1>
        <p class="text-xs text-slate-400">Student Mess Feedback Portal</p>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      
      <div class="bg-slate-800 text-white p-6 border-b border-slate-700">
        <h2 class="text-xl font-bold">Mess Feedback Form</h2>
        <p class="text-xs text-slate-300 mt-1">Experience for each meal (1 to 5 Stars)</p>
      </div>

      <form id="feedbackForm" onsubmit="handleFormSubmission(event)" class="p-6 space-y-6">
        
        <!-- Auth Details -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name <span class="text-red-500">*</span></label>
            <input type="text" id="studentName" required placeholder="e.g. Rahul Sharma" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">BITS Email Address <span class="text-red-500">*</span></label>
            <input type="text" id="studentEmail" required placeholder="f20260001 or name@dubai.bits-pilani.ac.in" oninput="autoCompleteDomain(this)" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm outline-none">
            <p class="text-[10px] text-amber-600 font-medium mt-1"><i class="fa-solid fa-circle-info mr-1"></i>Type '@' to automatically complete @dubai.bits-pilani.ac.in</p>
          </div>
        </div>

        <!-- Academic Category -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Academic Category / Batch <span class="text-red-500">*</span></label>
          <select id="studentCategory" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 text-sm bg-white outline-none">
            <option value="">-- Select Category --</option>
            <optgroup label="First Degree (B.E. / B.S.)">
              <option value="First Degree - 1st Year (2026 Batch)">1st Year (2026 Batch)</option>
              <option value="First Degree - 2nd Year (2025 Batch)">2nd Year (2025 Batch)</option>
              <option value="First Degree - 3rd Year (2024 Batch)">3rd Year (2024 Batch)</option>
              <option value="First Degree - 4th Year (2023 Batch)">4th Year (2023 Batch)</option>
            </optgroup>
            <optgroup label="Higher Degree (M.E. / M.B.A.)">
              <option value="Higher Degree - 1st Year Master's">1st Year Master's</option>
              <option value="Higher Degree - 2nd Year Master's">2nd Year Master's</option>
            </optgroup>
            <optgroup label="Doctoral Studies">
              <option value="PhD Scholar">PhD Scholar</option>
            </optgroup>
            <optgroup label="Others">
              <option value="Faculty / Staff">Faculty / Staff</option>
              <option value="Visitor / Guest">Visitor / Guest</option>
            </optgroup>
          </select>
        </div>

        <hr class="border-slate-200">

        <!-- Meal Ratings -->
        <div class="space-y-6">
          
          <!-- Breakfast -->
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-egg text-amber-500 mr-2"></i>Breakfast Rating <span class="text-red-500">*</span></span>
              <div class="star-rating" data-meal="breakfast">
                <i class="fa-solid fa-star inactive text-lg" data-value="1"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="2"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="3"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="4"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="5"></i>
              </div>
            </div>
            <textarea id="commentBreakfast" rows="2" placeholder="Specific comments for breakfast (Optional)" class="w-full p-2 border rounded-lg text-xs outline-none"></textarea>
          </div>

          <!-- Lunch -->
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-bowl-rice text-amber-500 mr-2"></i>Lunch Rating <span class="text-red-500">*</span></span>
              <div class="star-rating" data-meal="lunch">
                <i class="fa-solid fa-star inactive text-lg" data-value="1"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="2"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="3"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="4"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="5"></i>
              </div>
            </div>
            <textarea id="commentLunch" rows="2" placeholder="Specific comments for lunch (Optional)" class="w-full p-2 border rounded-lg text-xs outline-none"></textarea>
          </div>

          <!-- Evening Snacks -->
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-mug-hot text-amber-500 mr-2"></i>Evening Snacks Rating <span class="text-red-500">*</span></span>
              <div class="star-rating" data-meal="snacks">
                <i class="fa-solid fa-star inactive text-lg" data-value="1"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="2"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="3"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="4"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="5"></i>
              </div>
            </div>
            <textarea id="commentSnacks" rows="2" placeholder="Specific comments for evening snacks (Optional)" class="w-full p-2 border rounded-lg text-xs outline-none"></textarea>
          </div>

          <!-- Dinner -->
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-utensils text-amber-500 mr-2"></i>Dinner Rating <span class="text-red-500">*</span></span>
              <div class="star-rating" data-meal="dinner">
                <i class="fa-solid fa-star inactive text-lg" data-value="1"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="2"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="3"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="4"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="5"></i>
              </div>
            </div>
            <textarea id="commentDinner" rows="2" placeholder="Specific comments for dinner (Optional)" class="w-full p-2 border rounded-lg text-xs outline-none"></textarea>
          </div>

          <!-- General Facilities -->
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-dumpster-fire text-amber-500 mr-2"></i>Overall Cleanliness & Facilities <span class="text-red-500">*</span></span>
              <div class="star-rating" data-meal="general">
                <i class="fa-solid fa-star inactive text-lg" data-value="1"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="2"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="3"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="4"></i>
                <i class="fa-solid fa-star inactive text-lg" data-value="5"></i>
              </div>
            </div>
            <textarea id="commentGeneral" rows="2" placeholder="General suggestions or feedback (Optional)" class="w-full p-2 border rounded-lg text-xs outline-none"></textarea>
          </div>

        </div>

        <div id="formError" class="hidden p-3 bg-red-100 text-red-700 text-xs rounded-lg font-medium"></div>
        <div id="formSuccess" class="hidden p-3 bg-emerald-100 text-emerald-700 text-xs rounded-lg font-medium"></div>

        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-lg transition text-sm">
          Submit Feedback
        </button>
      </form>

    </div>
  </main>

  <script>
    const DOMAIN = "@dubai.bits-pilani.ac.in";
    const selectedRatings = { breakfast: 0, lunch: 0, snacks: 0, dinner: 0, general: 0 };
    
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxd0YJNZwt6hFplbt7p3eVUrLYLzvg12QU-nF3eY8iA4yCtA-CtMq7qDd45paRZUVntkg/exec";

    function autoCompleteDomain(input) {
      let val = input.value;
      if (val.includes('@')) {
        let username = val.split('@')[0];
        input.value = username + DOMAIN;
      }
    }

    // Star Rating Logic
    document.querySelectorAll('.star-rating').forEach(container => {
      const meal = container.dataset.meal;
      const stars = container.querySelectorAll('i');

      stars.forEach(star => {
        star.addEventListener('click', () => {
          const val = parseInt(star.dataset.value);
          selectedRatings[meal] = val;
          stars.forEach(s => {
            if (parseInt(s.dataset.value) <= val) {
              s.classList.remove('inactive'); s.classList.add('active');
            } else {
              s.classList.remove('active'); s.classList.add('inactive');
            }
          });
        });
      });
    });

    // Form Submission
    function handleFormSubmission(e) {
      e.preventDefault();
      const errDiv = document.getElementById('formError');
      const succDiv = document.getElementById('formSuccess');
      const submitBtn = document.getElementById('submitBtn');

      errDiv.classList.add('hidden'); succDiv.classList.add('hidden');

      let email = document.getElementById('studentEmail').value.trim().toLowerCase();
      if (!email.includes('@')) email += DOMAIN;

      if (!email.endsWith(DOMAIN)) {
        errDiv.textContent = `Please enter a valid ${DOMAIN} email address.`;
        errDiv.classList.remove('hidden'); return;
      }

      for (let key in selectedRatings) {
        if (selectedRatings[key] === 0) {
          errDiv.textContent = `Please select a star rating for ${key.toUpperCase()}.`;
          errDiv.classList.remove('hidden'); return;
        }
      }

      const payload = {
        data: [{
          Timestamp: new Date().toLocaleString(),
          Name: document.getElementById('studentName').value.trim(),
          Email: email,
          Category: document.getElementById('studentCategory').value,
          Breakfast_Rating: selectedRatings.breakfast,
          Breakfast_Comment: document.getElementById('commentBreakfast').value.trim(),
          Lunch_Rating: selectedRatings.lunch,
          Lunch_Comment: document.getElementById('commentLunch').value.trim(),
          Snacks_Rating: selectedRatings.snacks,
          Snacks_Comment: document.getElementById('commentSnacks').value.trim(),
          Dinner_Rating: selectedRatings.dinner,
          Dinner_Comment: document.getElementById('commentDinner').value.trim(),
          General_Rating: selectedRatings.general,
          General_Comment: document.getElementById('commentGeneral').value.trim()
        }]
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting Feedback...";

      fetch(API_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Feedback";
        succDiv.textContent = "Thank you! Your feedback has been recorded successfully.";
        succDiv.classList.remove('hidden');

        document.getElementById('feedbackForm').reset();
        document.querySelectorAll('.star-rating i').forEach(i => { i.classList.remove('active'); i.classList.add('inactive'); });
        for (let k in selectedRatings) selectedRatings[k] = 0;
      })
      .catch(err => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Feedback";
        errDiv.textContent = "Error submitting feedback. Please check connection.";
        errDiv.classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
